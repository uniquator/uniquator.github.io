<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileNest - Version Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            color: #000;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #666;
            font-weight: 300;
        }

        .status-icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status-icon.updated {
            animation: none;
            font-size: 64px;
        }

        .status-icon.outdated {
            animation: none;
            font-size: 64px;
        }

        .message {
            margin: 20px 0;
        }

        .message h2 {
            font-size: 24px;
            font-weight: 600;
            color: #000;
            margin-bottom: 15px;
        }

        .message p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .version-info {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border: 1px solid #eee;
        }

        .version-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
        }

        .version-row label {
            color: #666;
            font-weight: 500;
        }

        .version-row .value {
            color: #000;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .version-row .latest {
            color: #2ecc71;
        }

        .version-row .current {
            color: #e74c3c;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 28px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #000;
            color: #fff;
        }

        .btn-primary:hover {
            background: #333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #000;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
            transform: translateY(-2px);
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        .error {
            background: #fff5f5;
            border: 1px solid #fcc;
            border-radius: 10px;
            padding: 15px;
            color: #c00;
            font-size: 13px;
            margin: 20px 0;
        }

        .download-icon {
            margin-right: 8px;
        }

        .checkmark {
            color: #2ecc71;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .close-btn:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content">
            <div class="status-icon">
                <div class="loading">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            </div>
            <div class="message">
                <h2>Checking Version...</h2>
                <p>Please wait while we verify your FileNest version.</p>
            </div>
        </div>
    </div>

    <script>
        const VERSION_CACHE_KEY = 'filenest_cached_version';
        const VERSION_RELOAD_KEY = 'filenest_version_reload_done';
        const REPORT_BUG_URL = 'https://forms.gle/MWZxDdaa61T3uNaR9';

        // Parse URL parameters
        function getUrlParameter(name) {
            const url = window.location.href;
            const regex = new RegExp('[?&]' + name + '=([^&#]*)', 'i');
            const results = regex.exec(url);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Compare versions
        function compareVersions(current, latest) {
            const currentParts = current.split('.').map(Number);
            const latestParts = latest.split('.').map(Number);

            for (let i = 0; i < Math.max(currentParts.length, latestParts.length); i++) {
                const curr = currentParts[i] || 0;
                const latest_v = latestParts[i] || 0;

                if (curr < latest_v) return -1; // outdated
                if (curr > latest_v) return 1;   // ahead
            }
            return 0; // equal
        }

        // Main version check
        async function checkVersion() {
            const contentDiv = document.getElementById('content');
            const typeParam = getUrlParameter('type');
            const versionParam = getUrlParameter('version');

            if (!typeParam || !versionParam) {
                showMissingParameters(contentDiv);
                return;
            }

            const type = typeParam;
            const currentVersion = versionParam;

            try {
                // Fetch latest version
                const response = await fetch(`https://filenest.uniquator.me/${type}/lver.txt`);
                
                if (!response.ok) {
                    throw new Error('Could not fetch version file');
                }

                const latestVersion = (await response.text()).trim();
                const versionComparison = compareVersions(currentVersion, latestVersion);

                if (versionComparison === 0) {
                    // Cache matched version and perform a single forced reload.
                    localStorage.setItem(VERSION_CACHE_KEY, currentVersion);
                    if (!sessionStorage.getItem(VERSION_RELOAD_KEY)) {
                        sessionStorage.setItem(VERSION_RELOAD_KEY, '1');
                        window.location.reload();
                        return;
                    }

                    showUpdated(contentDiv, currentVersion);
                } else if (versionComparison < 0) {
                    sessionStorage.removeItem(VERSION_RELOAD_KEY);
                    // Version is outdated
                    showOutdated(contentDiv, currentVersion, latestVersion, type);
                } else {
                    sessionStorage.removeItem(VERSION_RELOAD_KEY);
                    // Version is ahead
                    showUpdated(contentDiv, currentVersion);
                }
            } catch (error) {
                showError(contentDiv, error.message);
            }
        }

        function handleReportBug(event) {
            if (event) {
                event.preventDefault();
            }
            localStorage.removeItem(VERSION_CACHE_KEY);
            sessionStorage.removeItem(VERSION_RELOAD_KEY);
            window.location.href = REPORT_BUG_URL;
        }

        function showUpdated(contentDiv, current) {
            contentDiv.innerHTML = `
                <div class="status-icon updated">
                    <span class="checkmark">✓</span>
                </div>
                <div class="message">
                    <h2>You're All Set!</h2>
                    <p>Your FileNest is running the latest version.</p>
                </div>
                <div class="version-info">
                    <div class="version-row">
                        <label>Current Version:</label>
                        <span class="value latest">${current}</span>
                    </div>
                </div>
                <div class="button-group">
                    <a class="btn btn-primary" href="${REPORT_BUG_URL}" onclick="handleReportBug(event)">
                        Report Bug
                    </a>
                </div>
            `;
        }

        function showOutdated(contentDiv, current, latest, type) {
            contentDiv.innerHTML = `
                <div class="status-icon outdated">
                    ⚠️
                </div>
                <div class="message">
                    <h2>You Are Not Updated</h2>
                    <p>A new version of FileNest is available. Please update to enjoy the latest features.</p>
                </div>
                <div class="version-info">
                    <div class="version-row">
                        <label>Latest Version:</label>
                        <span class="value latest">${latest}</span>
                    </div>
                    <div class="version-row">
                        <label>Your Version:</label>
                        <span class="value current">${current}</span>
                    </div>
                </div>
                <div class="button-group">
                    <a href="https://filenest.uniquator.me/${type}/latest-filenest.apk" class="btn btn-primary">
                        <span class="download-icon">⬇</span>Download Now
                    </a>
                    <button class="btn btn-secondary" onclick="window.history.back();">
                        Go Back
                    </button>
                </div>
            `;
        }

        function showError(contentDiv, error) {
            contentDiv.innerHTML = `
                <div class="message">
                    <h2>Error</h2>
                    <p>Unable to verify version at this time.</p>
                </div>
                <div class="error">
                    ${error}
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="location.reload();">
                        Retry
                    </button>
                </div>
            `;
        }

        function showMissingParameters(contentDiv) {
            const cachedVersion = localStorage.getItem(VERSION_CACHE_KEY);
            const versionLine = cachedVersion
                ? `<div class="version-info"><div class="version-row"><label>Cached Version:</label><span class="value latest">${cachedVersion}</span></div></div>`
                : '';

            contentDiv.innerHTML = `
                <div class="message">
                    <h2>please report from app or web portal</h2>
                    <p>Version details are missing from this link, so automatic reload is skipped.</p>
                </div>
                ${versionLine}
                <div class="button-group">
                    <a class="btn btn-primary" href="${REPORT_BUG_URL}" onclick="handleReportBug(event)">
                        Report Bug
                    </a>
                </div>
            `;
        }

        // Start version check when page loads
        document.addEventListener('DOMContentLoaded', checkVersion);
    </script>
</body>
</html>
